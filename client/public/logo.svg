<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="karigarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18202f" />
      <stop offset="100%" stop-color="#090d15" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Stylized Karigar "K" with craft wrench & sparkle geometry -->
  <!-- Left vertical pillar -->
  <rect x="32" y="28" width="15" height="72" rx="7.5" fill="url(#karigarGold)" />

  <!-- Upper diagonal wing -->
  <path d="M47 62 L78 33 A 6 6 0 0 1 87 42 L59 69 Z" fill="url(#karigarGold)" />

  <!-- Lower diagonal wing -->
  <path d="M57 66 L88 95 A 6 6 0 0 1 79 104 L45 74 Z" fill="url(#karigarGold)" />

  <!-- Sparkle Star emblem in top right -->
  <path d="M96 22 Q96 32 106 32 Q96 32 96 42 Q96 32 86 32 Q96 32 96 22 Z" fill="#fde047" filter="url(#glow)" />
</svg>
